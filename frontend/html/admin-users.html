<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoinJoy — Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../css/admin-shared.css">
    <link rel="stylesheet" href="../css/admin-users.css">
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-logo">
            <img src="../img/logo.png" alt="JoinJoy" class="sidebar-logo-img"/>
            <div>
                <div class="brand-name">JoinJoy</div>
                <div class="brand-sub">Admin Panel</div>
            </div>
        </div>
    </div>
    <div class="nav-section">
        <div class="nav-label">Main Menu</div>
        <a href="admin-dashboard.html" class="nav-item">
            <iconify-icon icon="si:dashboard-fill"></iconify-icon> Dashboard
        </a>
        <a href="admin-users.html" class="nav-item active">
            <iconify-icon icon="gridicons:user"></iconify-icon> Users
        </a>
        <a href="admin-trips.html" class="nav-item">
            <iconify-icon icon="mdi:map-marker-path"></iconify-icon> Trips
        </a>
    </div>
    <div class="sidebar-footer">
        <a href="admin-login.html" class="logout-btn" id="logoutBtn">
            <iconify-icon icon="material-symbols:logout-rounded"></iconify-icon> ออกจากระบบ
        </a>
    </div>
</nav>

<main class="main">
    <div class="page-header">
        <div>
            <h1 class="page-title">User Management</h1>
            <p class="page-subtitle">จัดการและตรวจสอบผู้ใช้งานทั้งหมด</p>
        </div>
    </div>

    <div class="filter-bar animate">
        <div class="search-wrap">
            <iconify-icon icon="mdi:magnify"></iconify-icon>
            <input type="text" class="search-input" id="searchInput" placeholder="ค้นหาชื่อหรืออีเมล...">
        </div>
        <select class="filter-select" id="statusFilter">
            <option value="">สถานะทั้งหมด</option>
            <option value="active">Active</option>
            <option value="banned">Banned</option>
        </select>
        <span class="filter-count" id="user-count">โหลดข้อมูล...</span>
    </div>

    <div class="table-card animate" style="animation-delay:0.1s;">
        <table>
            <thead>
                <tr>
                    <th>ผู้ใช้</th>
                    <th>บทบาท</th>
                    <th>สถานะ</th>
                    <th>เหตุผลการแบน</th>
                    <th>วันที่สมัคร</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody id="users-body">
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <iconify-icon icon="mdi:loading" style="animation: spin 1s linear infinite;"></iconify-icon>
                            กำลังโหลดข้อมูล...
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- BAN MODAL -->
<div class="modal-overlay" id="banModal">
    <div class="modal">
        <div class="modal-title">🚫 แบนผู้ใช้งาน</div>
        <div class="modal-sub" id="ban-modal-sub">ระบุเหตุผลการแบน</div>
        <div class="modal-label">เหตุผล *</div>
        <textarea class="modal-textarea" id="banReason" placeholder="เช่น: ละเมิดกฎการใช้งาน, สแปม, เนื้อหาไม่เหมาะสม..."></textarea>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeBanModal()">ยกเลิก</button>
            <button class="btn-primary" onclick="confirmBan()">ยืนยันการแบน</button>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:3000/api/admin';
    let allUsers = [];
    let selectedUserId = null;

    // ดึง adminId จาก localStorage — ถ้าไม่มีให้ redirect login
    function getAdminId() {
        const adminId = localStorage.getItem('adminId');
        if (!adminId) {
            alert('ไม่พบข้อมูล admin กรุณา login ใหม่');
            window.location.href = 'admin-login.html';
            return null;
        }
        return adminId;
    }

    async function loadUsers() {
        const search = document.getElementById('searchInput').value;
        const status = document.getElementById('statusFilter').value;
        let url = `${API}/users-list?`;
        if (search) url += `search=${encodeURIComponent(search)}&`;
        if (status) url += `status=${status}`;

        try {
            const res = await fetch(url);
            allUsers = await res.json();
            renderUsers(allUsers);
        } catch (e) {
            console.error(e);
        }
    }

    function renderUsers(users) {
        const tbody = document.getElementById('users-body');
        document.getElementById('user-count').textContent = `${users.length} รายการ`;

        if (!users.length) {
            tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">
                <iconify-icon icon="mdi:account-off-outline"></iconify-icon>
                ไม่พบผู้ใช้งาน
            </div></td></tr>`;
            return;
        }

        tbody.innerHTML = users.map(u => {
            const initial = (u.user_name || '?')[0].toUpperCase();
            const joined = new Date(u.created_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
            const isBanned = u.status === 'banned';

            return `<tr>
                <td>
                    <div class="user-info">
                        <div class="avatar">${initial}</div>
                        <div>
                            <div class="user-name">${u.user_name}</div>
                            <div class="user-email">${u.university_email}</div>
                        </div>
                    </div>
                </td>
                <td><span class="badge badge-${u.role}">${u.role}</span></td>
                <td><span class="badge badge-${u.status}">${isBanned ? '🚫 Banned' : '✅ Active'}</span></td>
                <td>${u.reason ? `<div class="reason-text" title="${u.reason}">${u.reason}</div>` : '<span style="color:var(--ink-lt)">—</span>'}</td>
                <td style="color:var(--ink-md);font-size:13px;">${joined}</td>
                <td>
                    ${isBanned
                        ? `<button class="action-btn btn-unban" onclick="unbanUser(${u.user_id})">
                            <iconify-icon icon="mdi:account-check-outline"></iconify-icon> ปลดแบน
                           </button>`
                        : `<button class="action-btn btn-ban" onclick="openBanModal(${u.user_id}, '${u.user_name}')">
                            <iconify-icon icon="mdi:account-cancel-outline"></iconify-icon> แบน
                           </button>`
                    }
                </td>
            </tr>`;
        }).join('');
    }

    function openBanModal(userId, name) {
        selectedUserId = userId;
        document.getElementById('ban-modal-sub').textContent = `แบนผู้ใช้: ${name}`;
        document.getElementById('banReason').value = '';
        document.getElementById('banModal').classList.add('open');
    }

    function closeBanModal() {
        document.getElementById('banModal').classList.remove('open');
        selectedUserId = null;
    }

    async function confirmBan() {
        const reason = document.getElementById('banReason').value.trim();
        if (!reason) { alert('กรุณากรอกเหตุผลการแบน'); return; }

        const adminId = getAdminId(); // ← ดึงจาก localStorage แทน hardcode 1
        if (!adminId) return;

        const res = await fetch(`${API}/ban-user`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: selectedUserId, admin_id: adminId, reason })
        });

        if (res.ok) {
            closeBanModal();
            loadUsers();
        } else {
            const data = await res.json();
            alert('เกิดข้อผิดพลาด: ' + (data.error || 'ไม่ทราบสาเหตุ'));
        }
    }

    async function unbanUser(userId) {
        if (!confirm('ปลดแบนผู้ใช้งานนี้?')) return;

        const adminId = getAdminId(); // ← ดึงจาก localStorage แทน hardcode 1
        if (!adminId) return;

        await fetch(`${API}/ban-user`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, admin_id: adminId, reason: '' })
        });
        loadUsers();
    }

    // Debounce search
    let timer;
    document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(loadUsers, 350);
    });
    document.getElementById('statusFilter').addEventListener('change', loadUsers);

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', e => {
        e.preventDefault();
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการออกจากระบบ?')) {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminId');
            window.location.href = 'admin-login.html';
        }
    });

    // Close modal on backdrop click
    document.getElementById('banModal').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeBanModal();
    });

    loadUsers();
</script>
</body>
</html>
